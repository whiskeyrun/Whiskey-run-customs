name: Inspect storefront source
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-source.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect storefront and admin code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("Whiskey_Run_Customs_Stripe_Ready")]
          out = ["WHISKEY RUN CUSTOMS SOURCE INSPECTION"]
          for root in roots:
              for p in sorted(root.rglob("*")):
                  if p.is_file():
                      out.append(f"FILE {p} ({p.stat().st_size} bytes)")
                      if p.suffix.lower() in (".html", ".js", ".mjs", ".json", ".toml"):
                          s = p.read_text(errors="replace")
                          out.append(f"LINES {len(s.splitlines())}; CHARS {len(s)}")
                          pats = ["admin", "upload", "supabase", "image_url", "imageUrl", "storage", "create-checkout", "stripe", "product", "localStorage", "dashboard"]
                          for term in pats:
                              matches = list(re.finditer(term, s, re.I))
                              if matches:
                                  out.append(f"  {term}: {len(matches)} matches")
                                  for m in matches[:3]:
                                      a=max(0,m.start()-180); b=min(len(s),m.end()+300)
                                      out.append("    "+re.sub(r"\\s+"," ",s[a:b]))
          report = "\\n".join(out)
          Path("source-inspection.txt").write_text(report)
          print(report[:50000])
          PY
          git add source-inspection.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add storefront source inspection report"
          git push
