name: Extract website files
on:
  push:
    paths:
      - 'Whiskey_Run_Customs_Stripe_Ready.zip'
      - '.github/workflows/extract-website.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website archive
        run: |
          mkdir -p /tmp/website
          unzip -o Whiskey_Run_Customs_Stripe_Ready.zip -d /tmp/website
          find /tmp/website -maxdepth 3 -type f | head -100
          cp -a /tmp/website/. .
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Extract website source files"
            git push
          fi
